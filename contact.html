<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Jamie</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/contact.css">
</head>
<body>
  <main class="page-content">
    <h1>Let’s talk</h1>
    <p>Got a project in mind? Send a message.</p>
    <form id="contact-form">
      <input type="text" id="name" placeholder="Your name" required>
      <input type="email" id="email" placeholder="Email address" required>
      <textarea id="message" rows="5" placeholder="What's the project about?" required></textarea>
      <button type="submit" class="btn-primary">Send message</button>
      <div id="form-feedback"></div>
    </form>
    <div class="contact-extra">
      <p>Or reach out directly: <strong>Kgomotso@studio.co.za</strong></p>
    </div>
  </main>
  <footer class="site-footer"><p>© 2026 Kgomotso — Johannesburg</p></footer>
  <script src="js/nav.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
